[project]
name = "agenticdev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harsh", email = "harsh.work211@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "fastapi==0.143.0",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.20",
    "iniconfig==2.3.1",
    "langgraph>=1.2.2",
    "opentelemetry-api==1.45.1",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pydantic==2.14.0",
    "pydantic-core==2.50.0",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "uvicorn[standard]>=0.54.0",
    "watchfiles==1.3.0",
    "websockets==17.2",
]

[project.scripts]
agenticdev = "agenticdev:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",    git status
    git diff
]

[tool.vercel]
entrypoint = "backend.main:app"